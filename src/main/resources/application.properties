# MongoDB local por padrao. Para outro banco, use as variaveis de ambiente
# SPRING_DATA_MONGODB_URI e SPRING_DATA_MONGODB_DATABASE (nunca versione credenciais).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=pizzaria

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
