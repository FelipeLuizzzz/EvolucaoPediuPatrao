<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-search me-2 text-primary"></i>Auditoria
        </h2>
    </div>

    <div id="msgAud"></div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-medium">Entidade</label>
                    <select id="fEntidade" class="form-select">
                        <option value="">Todas</option>
                        <option value="PEDIDO">Pedidos</option>
                        <option value="CLIENTE">Clientes</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-medium">ID da entidade (opcional)</label>
                    <input type="text" id="fId" class="form-control"/>
                </div>
                <div class="col-md-4">
                    <button type="button" id="btnFiltrar" class="btn btn-primary w-100">
                        <i class="bi bi-funnel me-1"></i>Consultar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Data e hora</th>
                        <th>Usuário</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Campo</th>
                        <th>Valor anterior</th>
                        <th>Novo valor</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody id="aud-tabela"></tbody>
            </table>
        </div>
    </div>

    <script>
    (function () {
        const tbody = document.getElementById('aud-tabela');
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
            c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

        async function consultar() {
            const params = new URLSearchParams();
            const ent = document.getElementById('fEntidade').value;
            const id = document.getElementById('fId').value.trim();
            if (ent) params.set('entidade', ent);
            if (id) params.set('entidadeId', id);
            try {
                const r = await fetch('/api/auditoria?' + params.toString());
                if (!r.ok) throw new Error('Erro ' + r.status);
                const regs = await r.json();
                if (!regs.length) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-5">Nenhum registro encontrado.</td></tr>';
                    return;
                }
                let html = '';
                regs.forEach(a => {
                    (a.alteracoes || []).forEach((c, i) => {
                        html += '<tr>' +
                            '<td class="ps-3">' + (i === 0 ? new Date(a.dataHora).toLocaleString('pt-BR') : '') + '</td>' +
                            '<td>' + (i === 0 ? esc(a.usuario) + '<br><small class="text-muted">' + esc(a.perfil) + '</small>' : '') + '</td>' +
                            '<td>' + (i === 0 ? esc(a.operacao) : '') + '</td>' +
                            '<td>' + (i === 0 ? esc(a.entidade) + '<br><small class="text-muted">' + esc(a.entidadeId) + '</small>' : '') + '</td>' +
                            '<td>' + esc(c.campo) + '</td>' +
                            '<td>' + (c.valorAnterior == null ? '—' : esc(c.valorAnterior)) + '</td>' +
                            '<td>' + (c.valorNovo == null ? '—' : esc(c.valorNovo)) + '</td>' +
                            '<td>' + (i === 0 ? esc(a.justificativa || '') : '') + '</td></tr>';
                    });
                });
                tbody.innerHTML = html;
            } catch (e) {
                document.getElementById('msgAud').innerHTML = '<div class="alert alert-danger">' + esc(e.message) + '</div>';
            }
        }

        document.getElementById('btnFiltrar').addEventListener('click', consultar);
        consultar();
    })();
    </script>

</div>

</body>
</html>
