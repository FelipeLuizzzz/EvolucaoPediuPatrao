<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" th:if="${perfil == 'ATENDENTE'}">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div id="msgCli"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela"></tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
    (function () {
        const PERFIL = /*[[${perfil}]]*/ 'N/A';
        const podeEditar = PERFIL === 'ATENDENTE';
        const podeExcluir = PERFIL === 'GERENTE';
        const tabela = document.getElementById('clientes-tabela');
        const msg = document.getElementById('msgCli');

        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
            c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));

        function aviso(texto, tipo) {
            msg.innerHTML = '<div class="alert alert-' + tipo + ' alert-dismissible fade show">' + esc(texto) +
                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
        }

        function formatarEndereco(c) {
            const partes = [c.logradouro, c.numero, c.complemento, c.bairro, c.cidade, c.estado]
                .filter(p => p && String(p).trim() !== '');
            return partes.length > 0 ? partes.join(', ') : (c.endereco || '-');
        }

        async function carregar() {
            try {
                const r = await fetch('/api/clientes');
                if (!r.ok) throw new Error('Erro ' + r.status);
                const clientes = await r.json();
                if (!clientes.length) {
                    tabela.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-5">Nenhum cliente cadastrado.</td></tr>';
                    return;
                }
                tabela.innerHTML = clientes.map(c => {
                    let acoes = '';
                    if (podeEditar) {
                        acoes += '<a href="/clientes/editar/' + encodeURIComponent(c.id) + '" class="btn btn-sm btn-outline-primary me-1">' +
                            '<i class="bi bi-pencil-fill"></i> Editar</a>';
                    }
                    if (podeExcluir) {
                        acoes += '<button class="btn btn-sm btn-outline-danger" data-excluir="' + esc(c.id) + '">' +
                            '<i class="bi bi-trash-fill"></i> Excluir</button>';
                    }
                    return '<tr><td>' + esc(c.nome || '-') + '</td><td>' + esc(c.telefone || '-') + '</td><td>' +
                        esc(formatarEndereco(c)) + '</td><td class="text-end pe-4">' + acoes + '</td></tr>';
                }).join('');
            } catch (e) {
                aviso(e.message, 'danger');
            }
        }

        tabela.addEventListener('click', async e => {
            const b = e.target.closest('button[data-excluir]');
            if (!b || !podeExcluir) return;
            if (!confirm('Tem certeza que deseja excluir este cliente?')) return;
            try {
                const r = await fetch('/api/clientes/' + encodeURIComponent(b.dataset.excluir), {method: 'DELETE'});
                if (!r.ok) throw new Error('Erro ao excluir o cliente (' + r.status + ').');
                aviso('Cliente excluído com sucesso.', 'success');
                carregar();
            } catch (err) {
                aviso(err.message, 'danger');
            }
        });

        carregar();
    })();
    </script>
</div>
</body>
</html>
