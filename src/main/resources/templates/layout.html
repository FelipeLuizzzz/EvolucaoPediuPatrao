<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script>
            (function () {
                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;
                const originalFetch = window.fetch;
                window.fetch = function (input, init) {
                    init = init || {};
                    const url = typeof input === 'string' ? input : input.url;
                    const method = (init.method || (typeof input !== 'string' && input.method) || 'GET').toUpperCase();
                    const mesmoSite = url.startsWith('/') || url.startsWith(location.origin);
                    if (mesmoSite && !['GET', 'HEAD', 'OPTIONS'].includes(method)) {
                        const headers = new Headers(init.headers || (typeof input !== 'string' ? input.headers : undefined) || {});
                        headers.set(header, token);
                        init.headers = headers;
                    }
                    return originalFetch.call(this, input, init);
                };
            })();
        </script>
    </head>
    <body>
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <form th:action="@{/logout}" method="post" class="position-fixed top-0 end-0 m-2" style="z-index:1050">
            <span class="small me-2" th:text="${usuarioNome} + ' (' + ${perfil} + ')'"></span>
            <button type="submit" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-box-arrow-right"></i> Sair
            </button>
        </form>

        <main class="container-fluid mt-4">
            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
